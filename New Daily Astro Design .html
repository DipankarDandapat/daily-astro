<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Daily Astro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600&family=Noto+Sans+Devanagari:wght@500&family=Noto+Sans+Bengali:wght@500&family=Noto+Sans+Tamil:wght@500&family=Noto+Sans+Telugu:wght@500&family=Noto+Sans+Gujarati:wght@500&family=Noto+Sans+Kannada:wght@500&family=Noto+Sans+Malayalam:wght@500&family=Noto+Sans+Gurmukhi:wght@500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e2a8a;--navy2:#16399f;--ink:#1b2340;--mut:#6b7494;--bg:#f2f4fb;--card:#fff;--line:#e5e8f3;--acc:#f5a623;--page:#dfe4f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8ecfb;--mut:#9aa4c8;--bg:#10162e;--card:#1a2244;--line:#2a345e;--page:#080c1c}}
:root[data-theme=dark]{--ink:#e8ecfb;--mut:#9aa4c8;--bg:#10162e;--card:#1a2244;--line:#2a345e;--page:#080c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;font-family:Poppins,'Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Gurmukhi',system-ui,sans-serif}
body{background:var(--page);display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--ink)}
.ph{width:390px;height:810px;max-width:100%;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 12px 40px #0003;border:6px solid #111}
@media(max-width:430px){body{display:block}.ph{width:100%;height:100vh;height:100dvh;border:0;border-radius:0}}
.hd{background:var(--navy);color:#fff;padding:18px 18px 16px;text-align:center;position:relative;font-weight:600}
.hd small{display:block;font-weight:400;opacity:.8;font-size:12px;margin-top:2px}
.hd .bk{position:absolute;left:14px;top:16px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.body{flex:1;overflow:auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.btn{width:100%;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.45}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 0 10px}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button.on{color:var(--navy2);font-weight:600}
:root[data-theme=dark] .nav button.on{color:#8fa8ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;font-size:12px;position:relative}
.cell img{height:44px;display:block;margin:0 auto 4px;border-radius:8px}
.cell.sel{border-color:var(--navy2);background:#e9efff}
:root[data-theme=dark] .cell.sel{background:#243268}
.cell small{display:block;color:var(--mut);font-size:9.5px}
.l2{grid-template-columns:repeat(2,1fr)}.l2 .cell{display:flex;align-items:center;gap:10px;padding:10px;text-align:left;font-size:15px;font-weight:500}.l2 .cell img{margin:0;height:34px}
.chk{position:absolute;right:8px;top:8px;background:var(--navy2);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:none;align-items:center;justify-content:center}.sel .chk{display:flex}
.sp{background:var(--navy);color:#fff;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sp img{height:62px;border-radius:50%}.sp b{display:block;margin-bottom:3px;font-size:14px}.sp p{font-size:12px;opacity:.9}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row img{height:34px;border-radius:10px}.row .t{flex:1;font-size:14px;font-weight:500}.row .t small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.row .ch{color:var(--mut);transition:.2s}.row.open .ch{transform:rotate(90deg)}
.ex{display:none;padding:0 4px 12px 50px;font-size:12.5px;color:var(--mut);line-height:1.55}.ex b{color:var(--ink)}.ex.show{display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink)}.chip.sel{background:var(--navy2);border-color:var(--navy2);color:#fff}
.sw{width:44px;height:25px;background:#c5cbe0;border-radius:20px;position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--navy2)}.sw.on::after{left:22px}
h3{font-size:13px;color:var(--mut);font-weight:500;margin:6px 4px 8px}
.in{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:14px}
.sheet{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:5}.sheet>div{background:var(--bg);width:100%;max-height:85%;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.day{display:flex;gap:6px;margin-bottom:12px}.day button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;cursor:pointer}.day button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.stars{color:var(--acc);letter-spacing:2px}.bar{height:7px;border-radius:5px;background:var(--line);flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.pc{text-align:center}.pc img.av{height:84px;border-radius:50%;margin-bottom:8px}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:9}
.sp0{background:var(--navy);flex:1;display:flex;flex-direction:column;color:#fff;text-align:center}
.sp0 .top{padding:36px 20px 14px}.sp0 .top img{height:36px}.sp0 h1{font-size:32px;font-family:Georgia,serif;margin:6px 0 2px;font-weight:500}.sp0 .top p{font-size:12px;opacity:.8}
.sp0 .w{background:var(--card);color:var(--ink);margin:0;border-radius:26px 26px 0 0;flex:1;padding:18px 22px;text-align:center}.sp0 .w img{height:150px;border-radius:50%}
.ob{flex:1;display:flex;flex-direction:column;min-height:0;color:#fff;background:radial-gradient(circle at 14% 9%,#fff 0 1px,transparent 2px),radial-gradient(circle at 82% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 60% 6%,#fff8 0 1px,transparent 2px),linear-gradient(180deg,#0a2486,#0e3aa8)}
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:12px;font-weight:600}
@media(max-width:430px){.sb{display:none}}
.ob .bk{position:absolute;left:14px;top:8px;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}
.t2{position:relative;text-align:center;padding:18px 20px 20px}.t2 h2{font-size:21px;font-weight:500;margin-bottom:6px}.t2 p{font-size:12px;opacity:.85}
.sh{flex:1;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;padding:16px 14px 14px;overflow:auto;display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font-size:15px;font-weight:500;cursor:pointer}
.lc img{height:34px;width:40px;object-fit:contain}.lc.sel{border-color:#2f55d8;background:#edf2ff;color:#0e2a8a}
.ck{margin-left:auto;width:20px;height:20px;border-radius:50%;background:#2f55d8;color:#fff;display:none;font-size:11px;align-items:center;justify-content:center;font-style:normal}.sel .ck{display:flex}
.cb{margin-top:auto;border-radius:10px}.sh .lg+.cb{margin-top:22px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);row-gap:10px;padding-top:6px}.sg>div{text-align:center;cursor:pointer;padding:6px 0;border-radius:12px}.sg>div:active{background:#edf2ff}
.sg img{height:64px;display:block;margin:0 auto 4px}.sg b{display:block;font-size:12.5px;font-weight:500}.sg small{font-size:9.5px;color:var(--mut)}
.wt{position:relative;text-align:center;padding:18px 20px 22px}.wt img{height:44px}.wt h1{font-family:'Playfair Display',Georgia,serif;font-size:36px;font-weight:600;margin:6px 0 2px}.wt p{font-size:12px;opacity:.85}
.mn{position:absolute;right:26px;top:26px;color:#f6c76b;font-size:26px}.pl{position:absolute;left:28px;top:70px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fa4ff,#2a4fd0)}
.st{position:absolute;color:#f6c76b;font-size:12px}.s1{right:70px;top:80px}.s2{left:64px;top:30px}
.wc{text-align:center;padding:12px 22px 14px}.wc img{height:138px;margin:0 auto}.wc h2{font-size:18px;font-weight:600;margin:8px 0 3px}.ws{font-size:11.5px;color:var(--mut);margin-bottom:14px}
.wl{text-align:left;font-size:12px;font-weight:500;margin-bottom:6px}.wi{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:14px}.wi input{border:0;outline:0;background:none;color:var(--ink);padding:12px 0;font-size:14px;width:100%}
.sf{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--mut);margin-top:10px}
.t2{padding:16px 24px 22px}.t2 h2{font-family:'Playfair Display',Georgia,serif;font-size:25px;font-weight:600;margin-bottom:8px}.t2 p{font-size:14px;line-height:1.35;max-width:230px;margin:0 auto;opacity:.92}.ob .bk{font-size:28px;top:12px;font-weight:300}
.sh{padding:14px 14px 16px}.lg{gap:12px}
.lc{height:76px;padding:0 12px 0 10px;background:var(--card);border:1px solid #edf0f7;box-shadow:0 1px 8px rgba(20,40,100,.07);border-radius:14px;font-size:17px;position:relative}
.lc img{height:50px;width:56px;object-fit:contain;flex:none}.lc span{flex:1;text-align:center;padding-right:4px}
.lc.sel{border:2px solid #4a78e6;background:#f1f6ff;color:#1d3fae}.lc .ck{position:absolute;right:10px;top:50%;margin:-11px 0 0;width:22px;height:22px;background:#0e2f86}.lc.sel span{padding-right:18px}
.sh .lg+.cb{margin-top:auto;padding:17px;font-size:16px;font-weight:600;background:#0d2f86;border-radius:11px;flex:none}.sh:has(.lg){gap:16px}.sh .lg{flex:1;grid-template-rows:repeat(5,minmax(70px,1fr))}.sh .lc{height:auto}.lc span{font-size:17px}
</style></head><body><div class="ph" id="app"></div>

const LOCSIGN=n=>{const a=SN[S.lang];const i=SIGNS.findIndex(x=>x[1]==n);return a&&i>=0?a.split(',')[i]:n};
const rng=i=>{const r=R[i],f=(m,d)=>new Date(2024,m-1,d).toLocaleDateString(LOC[S.lang],{month:'short',day:'numeric'});return f(r[0],r[1])+' - '+f(r[2],r[3])};
function trs(s){const k=s.trim();if(!k)return s;const i=LI[S.lang],L=LOC[S.lang];let m,o=k;
if(L=='en-US')return s;

const si=SIGNS.findIndex(x=>x[2]==k);if(si>=0)return s.replace(k,rng(si));

return o==k?s:s.replace(k,o)}
